<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Date</title><link rel="stylesheet" href="css/style.css"><script src="js/config.js" defer></script><script src="js/navigation.js" defer></script><script src="js/security.js" defer></script></head><body><main class="page"><div class="page-inner center"><div class="eyebrow">The auspicious day</div><h2 data-date></h2><div class="ornament">॥ श्री गणेशाय नमः ॥</div><p>Save the date and join us for our wedding ceremony.</p><div class="countdown"><div class="time-box"><strong id="days">--</strong><span>Days</span></div><div class="time-box"><strong id="hours">--</strong><span>Hours</span></div><div class="time-box"><strong id="minutes">--</strong><span>Minutes</span></div><div class="time-box"><strong id="seconds">--</strong><span>Seconds</span></div></div></div><nav class="nav"><a data-back href="#">← Back</a><span class="progress" data-progress></span><a data-next href="#">Next →</a></nav></main><script>document.addEventListener("DOMContentLoaded",()=>{const t=new Date(wedding.countdownDate).getTime();function tick(){let s=Math.max(0,Math.floor((t-Date.now())/1000));document.getElementById("days").textContent=Math.floor(s/86400);document.getElementById("hours").textContent=Math.floor(s%86400/3600);document.getElementById("minutes").textContent=Math.floor(s%3600/60);document.getElementById("seconds").textContent=s%60}tick();setInterval(tick,1000)});</script></body></html>
